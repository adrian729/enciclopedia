<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enciclopedia</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Enciclopedia - Personal Knowledge Base">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Enciclopedia',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 0,
      sidebarDisplayLevel: 1,
      plugins: [
        function fixHeadingIds(hook) {
          function scrollToId(id) {
            if (!id) return;
            var el = document.getElementById(id);
            if (el) el.scrollIntoView(true);
          }

          function getIdFromHash() {
            var m = location.hash.match(/[?&]id=([^&]+)/);
            return m ? decodeURIComponent(m[1]).replace(/^_(\d)/, '$1') : null;
          }

          // Strip _ prefix docsify adds to numeric-starting IDs
          hook.afterEach(function(html) {
            return html.replace(/ id="_(\d)/g, ' id="$1');
          });

          hook.doneEach(function() {
            // Fix sidebar auto-generated links
            document.querySelectorAll('.sidebar-nav a').forEach(function(a) {
              var href = a.getAttribute('href');
              if (href) a.setAttribute('href', href.replace(/#_(\d)/, '#$1').replace(/([?&]id=)_(\d)/g, '$1$2'));
            });
            // Scroll on page load / cross-page navigation
            scrollToId(getIdFromHash());
          });

          // querySelector('#1-xxx') is invalid CSS — docsify's scroll fails for
          // numeric-starting IDs. Catch clicks and use getElementById instead.
          hook.mounted(function() {
            document.addEventListener('click', function(e) {
              var a = e.target.closest('a[href]');
              if (!a) return;
              var href = a.getAttribute('href') || '';
              var m = href.match(/(?:#|[?&]id=)_?(\d[^&?]*)/);
              if (m) setTimeout(function() { scrollToId(m[1]); }, 10);
            });
          });
        },
        // KaTeX math. Extract \( … \) (inline) and \[ … \] (display) from the RAW
        // markdown in beforeEach — before marked can eat the backslashes or mangle
        // underscores/asterisks inside the math — then inject katex.renderToString
        // output in afterEach. Uses \( \[ delimiters (collision-free: never appear
        // elsewhere in docs; $ is avoided because 200+ lines use it as currency).
        function katexMath(hook) {
          var store = {};
          var seq = 0;
          hook.beforeEach(function (md) {
            md = md.replace(/\\\[([\s\S]+?)\\\]/g, function (_, tex) {
              var key = 'KXMATH' + (seq++) + 'XK';
              store[key] = { tex: tex, display: true };
              return key;
            });
            md = md.replace(/\\\(([\s\S]+?)\\\)/g, function (_, tex) {
              var key = 'KXMATH' + (seq++) + 'XK';
              store[key] = { tex: tex, display: false };
              return key;
            });
            return md;
          });
          hook.afterEach(function (html) {
            Object.keys(store).forEach(function (key) {
              if (html.indexOf(key) === -1) return;
              var out;
              try {
                out = katex.renderToString(store[key].tex, {
                  displayMode: store[key].display,
                  throwOnError: false
                });
              } catch (e) {
                out = store[key].tex;
              }
              html = html.split(key).join(out);
            });
            return html;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</body>
</html>
